<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="350" fill="#0d1117"/>
  <text x="20" y="30" fill="#e6edf3" font-weight="bold">Where blade modules come from</text>
  <rect x="20" y="50" width="290" height="100" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="74" fill="#e6edf3">Built in</text>
  <text x="32" y="96" fill="#8b949e" font-size="12">modules/&lt;id&gt;/blade.json</text>
  <text x="32" y="116" fill="#8b949e" font-size="12">files, properties, notes</text>
  <text x="32" y="136" fill="#8b949e" font-size="12">source: builtin</text>
  <rect x="335" y="50" width="290" height="100" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="347" y="74" fill="#e6edf3">Your own modules</text>
  <text x="347" y="96" fill="#8b949e" font-size="12">~/.config/omarchy/fileblade/</text>
  <text x="347" y="116" fill="#8b949e" font-size="12">modules/&lt;id&gt;/blade.json</text>
  <text x="347" y="136" fill="#8b949e" font-size="12">source: user</text>
  <rect x="650" y="50" width="290" height="100" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="662" y="74" fill="#e6edf3">Other Omarchy plugins</text>
  <text x="662" y="96" fill="#8b949e" font-size="12">manifest.json extensions key</text>
  <text x="662" y="116" fill="#8b949e" font-size="12">"data-goblin.fileblade/blade"</text>
  <text x="662" y="136" fill="#8b949e" font-size="12">source: plugin:&lt;pluginId&gt;</text>
  <line x1="165" y1="150" x2="380" y2="216" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="150" x2="480" y2="216" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="795" y1="150" x2="580" y2="216" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="32" y="208" fill="#8b949e" font-size="12">fileblade blade-modules (Rust scan)</text>
  <text x="690" y="208" fill="#8b949e" font-size="12">shell plugin registry (live)</text>
  <rect x="240" y="216" width="480" height="60" rx="6" fill="#1f2630" stroke="#58a6ff"/>
  <text x="252" y="240" fill="#58a6ff" font-weight="bold">BladeRegistry</text>
  <text x="252" y="262" fill="#8b949e" font-size="12">validate, bound, namespace ids, drop disabled providers</text>
  <line x1="480" y1="276" x2="480" y2="300" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="240" y="300" width="480" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="252" y="325" fill="#e6edf3" font-size="12">BladeSlot loads the entry QML with a BladeContext, on demand</text>
</svg>
