<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="How FileBlade finds and talks to its extensions">
<defs>
<marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/></marker>
<marker id="ma" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#e0af68"/></marker>
<marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
</defs>
<rect width="1200" height="920" fill="#0d1117"/>
<text x="40" y="46" fill="#e6edf3" font-size="22" font-weight="600">How FileBlade finds and talks to its extensions</text>
<text x="40" y="70" fill="#8b949e" font-size="13">FileBlade can be extended with extensions, which themselves are normal Omarchy plugins.</text>
<g transform="translate(40,100) scale(0.0912)"><g fill="#e6edf3"><path clip-rule="evenodd" d="m720 120h-15v15h-14.998v14.999l-60.002.001v15.002l90-.002v.002h.002l-.002 89.998h-15v15h-13v15h-17v-89.998h-45v90l-45-.002v-89.998h-14.998v-30h14.998v-15.002h-14.998v-30.001h14.998v-75h15v-14.997h15v-15.002h105.002zm-90-.001h45v-74.997h-45z" fill-rule="evenodd"/><path clip-rule="evenodd" d="m105 30.002h15v14.997h15v180.001h-15v15h-15v15.002h-75v-15.002h-15v-15h-15v-180.001h15v-14.997h15v-15.002h75zm-60 194.998h45v-179.998h-45z" fill-rule="evenodd"/><path d="m300 15h60v15h15v14.999h15v180.001h-15v15h-15v15h-15l-.004-209.998h-44.994v-.002h-.002v210.002h-45v-210h-44.998v179.997h-.002v30.003h-15v-15.002h-15v-15h-14.998v-180.001h14.998v-14.999h15v-15h60v-15h45z"/><path clip-rule="evenodd" d="m555 225h-15v15h-15v15h-15v-105.001l-44.998.001v105.002h-45.002v-105.002h-15v-30.001h15v-75h15.002v-14.997h15v-15.002h105zm-89.998-105.001h44.998v-74.997h-44.998z" fill-rule="evenodd"/><path d="m885 75h-15v15h-15v15h-15v-59.998h-45v179.998h45v-59.998h15v14.997h15v15.001h15v30h-15v15h-15v15.002l-105-.002v-210.001h14.998v-14.997h15.002v-15.002h105z"/><path d="m960 119.999h45v-104.999h15v15h15v14.999h15v75.001h15v15h-15v90h-15v15h-15v15h-15v-105h-45v105.002l-45-.002v-105h-30v-15h15v-15.001h15v-75h15v-14.997h15v-15.002h15z"/><path d="m1125 119.999h45v-104.999h15v15h15v15h15v180h-15v15h-15v15.002l-75-.002v-15h-15v-15h-15v-45.001h15v-14.997-.002h30v60h45v-75h-90v-105.001h15v-14.997h15v-15.002h15z"/></g></g>
<text x="172" y="112" fill="#e6edf3" font-size="14" font-weight="600">Omarchy</text>
<text x="172" y="130" fill="#8b949e" font-size="12">installs, updates, enables, disables and removes plugins; omarchy-shell (Quickshell) loads them</text>
<text x="40" y="164" fill="#e6edf3" font-size="13" font-weight="600">You already have FileBlade. To add an extension:</text>
<rect x="40" y="178" width="320" height="60" fill="#161b22" stroke="#30363d"/>
<text x="56" y="203" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">omarchy plugin add &lt;git url&gt; --enable</text>
<text x="56" y="223" fill="#8b949e" font-size="12">one command: installs the extension and turns it on</text>
<line x1="360" y1="208" x2="420" y2="208" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="420" y="178" width="320" height="60" fill="#161b22" stroke="#30363d"/>
<text x="436" y="203" fill="#e6edf3" font-size="13" font-weight="600">Omarchy turns it on</text>
<text x="436" y="223" fill="#8b949e" font-size="12">the shell loads it, FileBlade notices; no restart</text>
<line x1="740" y1="208" x2="800" y2="208" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mg)"/>
<rect x="800" y="178" width="360" height="60" fill="#161b22" stroke="#30363d"/>
<text x="816" y="203" fill="#e6edf3" font-size="13" font-weight="600">Pick it in FileBlade</text>
<text x="816" y="223" fill="#8b949e" font-size="12">gear picker in any blade, or: fileblade blade add right &lt;id&gt;</text>
<rect x="72" y="286" width="380" height="452" fill="#161b22" stroke="#7aa2f7" stroke-width="1.5"/>
<g transform="translate(92,300) scale(0.198)"><mask id="fbmark"><rect width="100%" height="100%" fill="#fff"/><path transform="translate(220,196) skewX(-9) translate(-220,-196)" d="M220,156 L227,189 L846,189 L227,203 L220,236 L213,203 L48,189 L213,189 Z" fill="none" stroke="#000" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="20"/><path transform="translate(220,196) skewX(-9) translate(-220,-196)" d="M48,189 L213,203 L213,216 L36,216 Z" fill="#000"/><g transform="translate(48,200) skewX(-9)"><path d="M30,-132 L30,8 M142,-112 L142,8" stroke="#000" stroke-width="7"/></g></mask>
<g mask="url(#fbmark)"><path transform="translate(48,200) skewX(-9)" d="M0,0 L0,-126.3 L62,-126.3 L78,-106.3 L172,-106.3 L172,0 Z" fill="#7aa2f7"/></g>
<path transform="translate(220,196) skewX(-9) translate(-220,-196)" d="M220,156 L227,189 L846,189 L227,203 L220,236 L213,203 L48,189 L213,189 Z" fill="#7aa2f7"/>
<path transform="translate(244,174) scale(1.1)" d="M3.6 0.0 15.200000000000001 -73.0H60.6L58.7 -61.400000000000006H25.700000000000003L22.6 -41.900000000000006H53.0L51.2 -30.3H21.0L16.1 0.0Z M64.6 0.0 66.4 -11.0H81.1L89.1 -62.0H74.5L76.2 -73.0H118.2L116.4 -62.0H101.7L93.7 -11.0H108.30000000000001L106.6 0.0Z M127.7 0.0 139.3 -73.0H151.8L142.0 -11.3H173.0L171.2 0.0Z M184.4 0.0 196.0 -73.0H239.8L238.0 -62.1H206.6L203.5 -43.1H231.5L229.8 -32.300000000000004H201.8L198.4 -10.9H229.9L228.2 0.0Z M243.3 0.0 254.9 -73.0H277.3Q284.2 -73.0 289.0 -70.65Q293.8 -68.3 296.0 -64.05Q298.2 -59.800000000000004 297.3 -54.2Q296.4 -48.2 292.25 -43.900000000000006Q288.1 -39.6 282.4 -38.7L282.3 -38.5Q288.5 -37.7 291.65 -32.7Q294.8 -27.700000000000003 293.7 -20.8Q292.1 -11.0 285.0 -5.5Q277.9 0.0 266.8 0.0ZM262.2 -42.900000000000006H272.3Q277.2 -42.900000000000006 280.5 -45.550000000000004Q283.8 -48.2 284.6 -52.800000000000004Q285.3 -57.300000000000004 282.85 -59.95Q280.4 -62.6 275.4 -62.6H265.3ZM257.1 -10.4H267.8Q273.2 -10.4 276.85 -13.350000000000001Q280.5 -16.3 281.3 -21.400000000000002Q282.1 -26.5 279.4 -29.650000000000002Q276.7 -32.800000000000004 271.3 -32.800000000000004H260.6Z M307.7 0.0 319.3 -73.0H331.8L322.0 -11.3H353.0L351.2 0.0Z M359.1 0.0 389.1 -73.0H405.2L412.1 0.0H399.7L398.5 -17.7H379.1L372.3 0.0ZM382.9 -27.900000000000002H397.8L396.5 -47.5Q396.1 -52.400000000000006 395.9 -56.35000000000001Q395.7 -60.300000000000004 395.7 -62.1Q395.1 -60.300000000000004 393.75 -56.35000000000001Q392.4 -52.400000000000006 390.6 -47.6Z M423.1 0.0 434.7 -73.0H456.4Q463.8 -73.0 468.8 -70.15Q473.8 -67.3 476.0 -62.2Q478.2 -57.1 477.1 -50.2L472.8 -22.900000000000002Q471.7 -16.0 467.85 -10.85Q464.0 -5.7 458.1 -2.85Q452.2 0.0 444.8 0.0ZM437.4 -11.5H446.6Q452.1 -11.5 455.75 -14.55Q459.4 -17.6 460.2 -22.900000000000002L464.6 -50.2Q465.4 -55.400000000000006 462.65 -58.45Q459.9 -61.5 454.5 -61.5H445.3Z M484.4 0.0 496.0 -73.0H539.8L538.0 -62.1H506.6L503.5 -43.1H531.5L529.8 -32.300000000000004H501.8L498.4 -10.9H529.9L528.2 0.0Z" fill="#7aa2f7"/></g>
<rect x="92" y="384" width="340" height="60" fill="#0d1117" stroke="#30363d"/>
<rect x="92" y="394" width="3" height="40" fill="#7aa2f7"/>
<text x="108" y="409" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">blades/BladeRegistry.qml</text>
<text x="108" y="429" fill="#8b949e" font-size="12">finds modules and checks each one is valid</text>
<rect x="92" y="464" width="340" height="60" fill="#0d1117" stroke="#30363d"/>
<rect x="92" y="474" width="3" height="40" fill="#7aa2f7"/>
<text x="108" y="489" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">blades/BladeSlot.qml + BladeContext.qml</text>
<text x="108" y="509" fill="#8b949e" font-size="12">shows a module and gives it its tools</text>
<rect x="92" y="544" width="340" height="60" fill="#0d1117" stroke="#30363d"/>
<rect x="92" y="554" width="3" height="40" fill="#7aa2f7"/>
<text x="108" y="569" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">fileblade-bin (Rust backend)</text>
<text x="108" y="589" fill="#8b949e" font-size="12">does file work, scans for modules, runs helpers</text>
<text x="92" y="642" fill="#8b949e" font-size="11.5">Modules can also live in these folders, same rules:</text>
<text x="92" y="662" fill="#8b949e" font-size="11.5" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">modules/&lt;id&gt;/blade.json</text>
<text x="92" y="680" fill="#8b949e" font-size="11.5" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">~/.config/omarchy/fileblade/modules/&lt;id&gt;/blade.json</text>
<text x="92" y="710" fill="#8b949e" font-size="11.5">Plugin modules are named &lt;pluginId&gt;/&lt;id&gt;, so names never clash.</text>
<rect x="772" y="262" width="380" height="452" fill="#161b22" stroke="#30363d" opacity="0.7"/>
<rect x="760" y="274" width="380" height="452" fill="#161b22" stroke="#30363d" opacity="0.7"/>
<rect x="748" y="286" width="380" height="452" fill="#161b22" stroke="#e0af68" stroke-width="1.5"/>
<text x="768" y="316" fill="#e6edf3" font-size="16" font-weight="600">FileBlade extension</text>
<text x="768" y="336" fill="#8b949e" font-size="12">a normal Omarchy plugin, e.g. data-goblin.fileblade-skills</text>
<text x="768" y="368" fill="#8b949e" font-size="12">nothing extra to register in FileBlade</text>
<rect x="768" y="384" width="340" height="60" fill="#0d1117" stroke="#30363d"/>
<rect x="768" y="394" width="3" height="40" fill="#e0af68"/>
<text x="784" y="409" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">manifest.json</text>
<text x="784" y="429" fill="#8b949e" font-size="12">extensions["data-goblin.fileblade/blade"]: [ ... ]</text>
<rect x="768" y="464" width="340" height="60" fill="#0d1117" stroke="#30363d"/>
<rect x="768" y="474" width="3" height="40" fill="#e0af68"/>
<text x="784" y="489" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">blades/Module.qml</text>
<text x="784" y="509" fill="#8b949e" font-size="12">the panel people see; it receives a context</text>
<rect x="768" y="544" width="340" height="60" fill="#0d1117" stroke="#30363d"/>
<rect x="768" y="554" width="3" height="40" fill="#e0af68"/>
<text x="784" y="569" fill="#e6edf3" font-size="13" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">Service.qml + bin/helper</text>
<text x="784" y="589" fill="#8b949e" font-size="12">background work shared by every copy of the panel</text>
<line x1="938" y1="544" x2="938" y2="524" stroke="#8b949e" stroke-width="1.5" marker-end="url(#mg)"/>
<text x="948" y="538" fill="#8b949e" font-size="11" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace">context.providerService</text>
<text x="768" y="642" fill="#8b949e" font-size="11.5">Omarchy handles installing, updating, turning on and</text>
<text x="768" y="660" fill="#8b949e" font-size="11.5">removing the plugin. FileBlade only says what a module</text>
<text x="768" y="678" fill="#8b949e" font-size="11.5">must look like.</text>
<text x="768" y="696" fill="#8b949e" font-size="11.5"></text>
<text x="768" y="714" fill="#8b949e" font-size="11.5">The same panel can be open in several places at once.</text>
<text x="768" y="732" fill="#8b949e" font-size="11.5">Background work lives in Service.qml so it runs once.</text>
<path d="M580,238 L580,346 L432,346 L432,384" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mg)"/>
<circle cx="580" cy="262" r="10" fill="#8b949e"/>
<text x="580" y="266" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="568" y="312" fill="#8b949e" font-size="12" text-anchor="end">the shell says which</text>
<text x="568" y="328" fill="#8b949e" font-size="12" text-anchor="end">plugins are on</text>
<line x1="432" y1="410" x2="748" y2="410" stroke="#7aa2f7" stroke-width="2" marker-end="url(#mb)"/>
<circle cx="600" cy="410" r="10" fill="#7aa2f7"/>
<text x="600" y="414" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="600" y="398" fill="#7aa2f7" font-size="12" text-anchor="middle">read the list, check it, name it</text>
<line x1="432" y1="488" x2="748" y2="488" stroke="#7aa2f7" stroke-width="2" marker-end="url(#mb)"/>
<circle cx="600" cy="488" r="10" fill="#7aa2f7"/>
<text x="600" y="492" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="600" y="474" fill="#7aa2f7" font-size="12" text-anchor="middle">load the panel, hand it a context</text>
<line x1="748" y1="514" x2="432" y2="514" stroke="#e0af68" stroke-width="2" marker-end="url(#ma)"/>
<circle cx="600" cy="514" r="10" fill="#e0af68"/>
<text x="600" y="518" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="600" y="540" fill="#e0af68" font-size="12" text-anchor="middle">talk back only through that context</text>
<line x1="432" y1="582" x2="748" y2="582" stroke="#e0af68" stroke-width="2" marker-start="url(#ma)" marker-end="url(#ma)"/>
<circle cx="600" cy="582" r="10" fill="#e0af68"/>
<text x="600" y="586" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">5</text>
<text x="600" y="608" fill="#e0af68" font-size="12" text-anchor="middle">helpers run through the FileBlade backend</text>
<circle cx="52" cy="784" r="10" fill="#8b949e"/>
<text x="52" y="788" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="72" y="788" fill="#e6edf3" font-size="12.5">Omarchy turns a plugin on. The shell tells FileBlade right away; no rescan, no restart.</text>
<circle cx="52" cy="814" r="10" fill="#7aa2f7"/>
<text x="52" y="818" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="72" y="818" fill="#e6edf3" font-size="12.5">FileBlade reads the plugin manifest, checks the module is valid and fits this version, and lists it in the picker.</text>
<circle cx="52" cy="844" r="10" fill="#7aa2f7"/>
<text x="52" y="848" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="72" y="848" fill="#e6edf3" font-size="12.5">When you put the module in a slot, FileBlade loads its panel and gives it one context object: its tools.</text>
<circle cx="52" cy="874" r="10" fill="#e0af68"/>
<text x="52" y="878" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="72" y="878" fill="#e6edf3" font-size="12.5">The panel only uses that context: saved state, the selected file, focus, tabs, settings. It never reaches inside FileBlade.</text>
<circle cx="52" cy="904" r="10" fill="#e0af68"/>
<text x="52" y="908" fill="#0d1117" font-size="12" font-weight="700" text-anchor="middle">5</text>
<text x="72" y="908" fill="#e6edf3" font-size="12.5">A plugin may ship a small program. The FileBlade backend runs it with a fixed argument list and reads its JSON answer.</text>
</svg>
